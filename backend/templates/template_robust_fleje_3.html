<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartela Robust Fleje 3 (90x74mm)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #f8fafc;
            overflow: hidden;
            display: block;
            padding: 15mm;
        }
        
        @media print {
            body {
                background: #fff;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .card {
            width: 100mm;
            height: 70mm;
            background: #5d6368; /* Tono de gris industrial */
            border: 1.5px dashed #ffffff; /* LÍNEAS PUNTEADAS EN LOS 4 COSTADOS */
            isolation: isolate;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            padding: 3.2mm 3.8mm 2.8mm 3.8mm;
        }

        /* 1. LOGO ROBUST OFICIAL DE ALTA PRECISIÓN */
        .brand-container {
            margin-bottom: 1.2mm;
            max-height: 7.5mm;
            display: flex;
            align-items: center;
        }
        .brand-container img {
            max-height: 7.5mm;
            max-width: 38mm;
            object-fit: contain;
            display: block;
        }

        /* 2. COLUMNA IZQUIERDA (48mm) */
        .left-content {
            width: 48mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            height: 100%;
            overflow: hidden;
        }

        /* 3. TÍTULO EN 2 LÍNEAS (TALADRO / PERCUTOR) */
        .title-container {
            margin-bottom: 1.2mm;
            max-width: 100%;
            overflow: hidden;
        }
        .title-primary {
            font-size: 8.5pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 0.2px;
            white-space: normal;
            word-break: break-word;
        }
        .title-primary.title-size-short {
            font-size: 9.5pt;
            line-height: 1.02;
        }
        .title-primary.title-size-medium {
            font-size: 8.5pt;
            line-height: 1.05;
        }
        .title-primary.title-size-long {
            font-size: 7.8pt;
            line-height: 1.05;
        }
        .title-secondary {
            font-size: 6.8pt;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.08;
            letter-spacing: 0.1px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 100%;
            word-break: break-word;
        }
        .title-secondary.title-size-long {
            font-size: 6.0pt;
            line-height: 1.05;
        }

        /* 4. BLOQUE DESTACADO (18V ⚡ BRUSHLESS) */
        .highlight-pill {
            display: var(--pill-display, inline-flex);
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 0.5mm 1.6mm;
            font-size: 5.8pt;
            font-weight: 700;
            margin-bottom: 1.2mm;
            width: fit-content;
            background: transparent;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }
        .pill-text-white {
            color: #ffffff;
        }
        .pill-bolt {
            color: #ffffff;
            margin: 0 0.8mm;
            font-size: 5.5pt;
        }
        .pill-text-cyan {
            color: #00c3e6;
            font-weight: 800;
        }

        /* 5. ESPECIFICACIONES */
        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.7mm;
            margin-bottom: 1.2mm;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }
        .specs-list.density-low {
            gap: 1.2mm;
        }
        .specs-list.density-low .spec-item {
            font-size: 6.5pt;
        }
        .specs-list.density-normal {
            gap: 0.7mm;
        }
        .specs-list.density-normal .spec-item {
            font-size: 6.2pt;
        }
        .specs-list.density-high {
            gap: 0.5mm;
        }
        .specs-list.density-high .spec-item {
            font-size: 5.8pt;
        }
        .spec-item {
            font-size: 6.2pt;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.15;
            display: flex;
            align-items: flex-start;
        }
        .spec-bullet {
            color: #ffffff;
            font-weight: bold;
            margin-right: 1.2mm;
            font-size: 7pt;
            line-height: 1;
        }
        .spec-text {
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 6. SKU INFERIOR IZQUIERDO Y META-INFO (ORIGEN Y GARANTÍA) */
        .sku-box {
            border-top: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 0.8mm 0;
            margin-top: auto;
            width: 26mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .sku-text {
            font-size: 6.5pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 0.4mm;
            margin-top: 0.8mm;
        }
        .meta-text {
            font-size: 5.5pt;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        /* 7. COLUMNA DERECHA: FOTO INTEGRADA EN COLUMNA REAL (SIN SOBREPOSICIÓN) */
        .right-content {
            width: 44mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
            padding: 1mm;
            background: transparent;
        }

        .product-image {
            max-width: 100%;
            max-height: 58mm;
            object-fit: contain;
            background: transparent;
        }

        /* 8. SELLO CIRCULAR DE GARANTÍA (ZONA SEGURA AISLADA EN EXTREMO INFERIOR DERECHO) */
        .warranty-seal {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14mm;
            height: 14mm;
            object-fit: contain;
            display: var(--warranty-display, block);
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Columna Izquierda (Texto & Especificaciones) -->
        <div class="left-content">
            <div>
                <!-- Logotipo ROBUST (Cargado dinámicamente desde DB / Storage) -->
                <div class="brand-container">
                    {{marca}}
                </div>

                <!-- Título en 2 Líneas (ej. TALADRO / PERCUTOR) -->
                <div class="title-container">
                    <div class="title-primary {{title_class}}">{{titulo_linea1}}</div>
                    <div class="title-secondary {{title_class}}">{{titulo_linea2}}</div>
                </div>

                <!-- Bloque Destacado (18V ⚡ BRUSHLESS) -->
                <div class="highlight-pill" style="--pill-display: {{pill_display}};">
                    <span class="pill-text-white">{{destacado_val}}</span>
                    <span class="pill-bolt">⚡</span>
                    <span class="pill-text-cyan">{{destacado_lbl}}</span>
                </div>

                <!-- Especificaciones Limpias -->
                <ul class="specs-list {{density_class}}">
                    {{specs_html}}
                </ul>
            </div>

            <!-- SKU Inferior Izquierdo -->
            <div class="sku-box">
                <span class="sku-text">SKU: {{sku}}</span>
            </div>

            <!-- Origen y Garantía Dinámicos para Robust -->
            {{meta_info_html}}
        </div>

        <!-- Columna Derecha (Foto en Columna Real + Sello en Zona Segura) -->
        <div class="right-content">
            <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
            <img class="warranty-seal" src="{{garantia_sello_img}}" alt="5 Años de Garantía" style="--warranty-display: {{warranty_seal_display}};" />
        </div>
    </div>
</body>
</html>
