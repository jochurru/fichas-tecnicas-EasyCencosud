<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartela Robust Fleje 3 (90x74mm)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #f8fafc;
            overflow: hidden;
            display: block;
            padding: 15mm;
        }
        
        @media print {
            body {
                background: #fff;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .card {
            width: 90mm;
            height: 74mm;
            background: #5d6368; /* Tono de gris industrial de la Imagen 2 */
            border: 1.5px dashed #ffffff; /* LÍNEAS PUNTEADAS EN LOS 4 COSTADOS */
            isolation: isolate;
            display: flex;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            padding: 4.5mm 5mm 4mm 5mm;
        }

        /* 1. LOGO ROBUST OFICIAL DE ALTA PRECISIÓN */
        .brand-container {
            margin-bottom: 2mm;
            max-height: 8mm;
            display: flex;
            align-items: center;
        }
        .brand-container img {
            max-height: 8mm;
            max-width: 38mm;
            object-fit: contain;
            display: block;
        }

        /* 2. COLUMNA IZQUIERDA */
        .left-content {
            width: 46%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            height: 100%;
            overflow: hidden;
        }

        /* 3. TÍTULO EN 2 LÍNEAS (TALADRO / PERCUTOR) */
        .title-container {
            margin-bottom: 2mm;
            max-width: 36mm;
            overflow: hidden;
        }
        .title-primary {
            font-size: 10pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .title-secondary {
            font-size: 8pt;
            font-weight: 500;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 0.2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 36mm;
        }

        /* 4. BLOQUE DESTACADO (18V ⚡ BRUSHLESS) */
        .highlight-pill {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 0.8mm 2.2mm;
            font-size: 6.5pt;
            font-weight: 700;
            margin-bottom: 2mm;
            width: fit-content;
            background: transparent;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }
        .pill-text-white {
            color: #ffffff;
        }
        .pill-bolt {
            color: #ffffff;
            margin: 0 0.8mm;
            font-size: 6pt;
        }
        .pill-text-cyan {
            color: #00c3e6;
            font-weight: 800;
        }

        /* 5. ESPECIFICACIONES */
        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1mm;
            margin-bottom: 2mm;
            max-width: 100%;
        }
        .spec-item {
            font-size: 6.5pt;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.15;
            display: flex;
            align-items: flex-start;
        }
        .spec-bullet {
            color: #ffffff;
            font-weight: bold;
            margin-right: 1.2mm;
            font-size: 7.5pt;
            line-height: 1;
        }
        .spec-text {
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 6. SKU INFERIOR IZQUIERDO CON LÍNEAS HORIZONTALES (TEXTO CENTRADO ENTRE LÍNEAS) */
        .sku-box {
            border-top: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 1.2mm 0;
            margin-top: auto;
            width: 28mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .sku-text {
            font-size: 6.5pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        /* 7. COLUMNA DERECHA: FOTO INTEGRADA DIRECTAMENTE SOBRE FONDO (SIN CUADRO BLANCO NI DESBORDES) */
        .right-content {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 52%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 4mm 3mm;
            background: transparent;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent;
            mix-blend-mode: multiply;
        }

        /* 8. SELLO CIRCULAR DE GARANTÍA (EXTREMO INFERIOR DERECHO) */
        .warranty-seal {
            position: absolute;
            right: 3.5mm;
            bottom: 3.5mm;
            width: 16mm;
            height: 16mm;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: transparent;
            z-index: 20;
        }
        .warranty-seal-inner {
            width: 14mm;
            height: 14mm;
            border: 0.8px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .warranty-label {
            font-size: 3.2pt;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1;
        }
        .warranty-number {
            font-size: 11pt;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.9;
            font-family: 'Arial Black', sans-serif;
            margin: 0.2mm 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Columna Izquierda (Texto & Especificaciones) -->
        <div class="left-content">
            <div>
                <!-- Logotipo ROBUST (Cargado dinámicamente desde DB / Storage) -->
                <div class="brand-container">
                    {{marca}}
                </div>

                <!-- Título en 2 Líneas (ej. TALADRO / PERCUTOR) -->
                <div class="title-container">
                    <div class="title-primary">{{titulo_linea1}}</div>
                    <div class="title-secondary">{{titulo_linea2}}</div>
                </div>

                <!-- Bloque Destacado (18V ⚡ BRUSHLESS) -->
                <div class="highlight-pill">
                    <span class="pill-text-white">{{destacado_val}}</span>
                    <span class="pill-bolt">⚡</span>
                    <span class="pill-text-cyan">{{destacado_lbl}}</span>
                </div>

                <!-- Especificaciones Limpias -->
                <ul class="specs-list">
                    {{specs_html}}
                </ul>
            </div>

            <!-- SKU Inferior Izquierdo -->
            <div class="sku-box">
                <span class="sku-text">SKU: {{sku}}</span>
            </div>
        </div>

        <!-- Columna Derecha (Foto Gigante Sin Cuadro Blanco + Sello Circular de Garantía) -->
        <div class="right-content">
            <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
            
            <div class="warranty-seal">
                <div class="warranty-seal-inner">
                    <span class="warranty-label">AÑOS DE GARANTÍA</span>
                    <span class="warranty-number">{{garantia_numero}}</span>
                    <span class="warranty-label">AÑOS DE GARANTÍA</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
