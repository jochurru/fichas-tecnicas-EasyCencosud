<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión de Flejes por Lote</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        .card-robust-fleje3, .card-robust-fleje3 *,
        .card-robust-fleje2, .card-robust-fleje2 *,
        .page-robust-a4, .page-robust-a4 * {
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            background: #ffffff;
            margin: 0;
            padding: 0;
        }
        @media print {
            body {
                background: #ffffff;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
        
        /* Contenedores de Página A4 */
        .page {
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            box-sizing: border-box;
            page-break-after: always;
            display: grid;
            justify-content: center;
            align-content: start;
            overflow: hidden;
        }
        .page:last-child {
            page-break-after: avoid !important;
        }

        /* DISEÑO DE GRILLA: FLEJE 3 (100x70mm) - 2x3 (6 por hoja) */
        .page-fleje3 {
            padding: 37.5mm 5mm;
            grid-template-columns: repeat(2, 100mm);
            column-gap: 0;
            row-gap: 6mm;
            justify-content: center;
            align-content: start;
        }

        /* DISEÑO DE GRILLA: FLEJE 2 (80x40mm) - 2x6 (12 por hoja) */
        .page-fleje2 {
            grid-template-columns: repeat(2, 80mm);
            grid-gap: 5mm 8mm;
            padding: 15mm 20mm;
        }

        /* ESTILOS DE TARJETA: FLEJE 3 (100x70mm) */
        .card-fleje3 {
            width: 100mm;
            height: 70mm;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        .card-fleje3 .header {
            background: #222222;
            color: #ffffff;
            height: 15mm;
            padding: 1.8mm 3.2mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-fleje3 .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 63%;
        }
        .card-fleje3 .header-title {
            font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif;
            font-size: 11pt;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1px;
            line-height: 1.05;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 8.5mm;
        }
        .card-fleje3 .header-title.title-size-short {
            font-size: 12pt;
            line-height: 1.02;
        }
        .card-fleje3 .header-title.title-size-medium {
            font-size: 11pt;
            line-height: 1.05;
        }
        .card-fleje3 .header-title.title-size-long {
            font-size: 9.8pt;
            line-height: 1.05;
        }
        .card-fleje3 .header-subtitle {
            font-size: 8.8pt;
            font-weight: 700;
            color: #ffed00; /* Amarillo Easy */
            margin-top: 0.3mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-fleje3 .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 35%;
            align-items: flex-end;
        }
        .card-fleje3 .header-brand {
            font-size: 9.5pt;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.05;
        }
        .card-fleje3 .header-sku {
            font-size: 7.5pt;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-top: 0.3mm;
        }
        .card-fleje3 .body-grid {
            flex: 1;
            display: flex;
            height: 39.5mm;
            border-bottom: 1px solid #cbd5e1;
        }
        .card-fleje3 .specs-column {
            width: 46%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #cbd5e1;
            background: #f8fafc;
            padding: 1.8mm 2.5mm;
            overflow: hidden;
        }
        .card-fleje3 .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8mm;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .card-fleje3 .specs-list.density-low {
            gap: 1.4mm;
        }
        .card-fleje3 .specs-list.density-low .spec-item {
            font-size: 6.8pt;
        }
        .card-fleje3 .specs-list.density-normal {
            gap: 0.8mm;
        }
        .card-fleje3 .specs-list.density-normal .spec-item {
            font-size: 6.5pt;
        }
        .card-fleje3 .specs-list.density-high {
            gap: 0.6mm;
        }
        .card-fleje3 .specs-list.density-high .spec-item {
            font-size: 6.0pt;
        }
        .card-fleje3 .spec-item {
            font-size: 6.5pt;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.15;
            display: flex;
            align-items: flex-start;
        }
        .card-fleje3 .spec-bullet {
            color: #e30613;
            font-weight: bold;
            margin-right: 1.2mm;
            font-size: 7.5pt;
            line-height: 1;
        }
        .card-fleje3 .spec-text {
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-fleje3 .image-column {
            width: 54%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2mm;
            background: #ffffff;
        }
        .card-fleje3 .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-fleje3 .footer-grid {
            height: 12.5mm;
            display: flex;
            background: #f1f5f9;
        }
        .card-fleje3 .footer-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #cbd5e1;
            padding: 0.4mm 1mm;
            text-align: center;
        }
        .card-fleje3 .footer-cell:last-child {
            border-right: none;
        }
        .card-fleje3 .footer-label {
            font-size: 5.8pt;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            margin-bottom: 0.1mm;
        }
        .card-fleje3 .footer-value {
            font-size: 9.5pt;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.05;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 100%;
        }
        .card-fleje3 .bottom-bar {
            height: 3mm;
            background: #e30613; /* Rojo Easy */
            width: 100%;
        }

        /* ESTILOS DE TARJETA: FLEJE 2 (80x40mm) */
        .card-fleje2 {
            width: 80mm;
            height: 40mm;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            overflow: hidden;

        }
        .card-fleje2 .header-left {

            flex-direction: column;

        .card-fleje2 .header-title {

            text-transform: uppercase;

            line-height: 1;
            display: -webkit-box;

        .card-fleje2 .header-subtitle {

            font-weight: 700;

            margin-top: 0.2mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-fleje2 .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 38%;
            align-items: flex-end;
        }
        .card-fleje2 .header-brand {
            font-size: 7pt;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.05;
        }
        .card-fleje2 .header-sku {
            font-size: 5.5pt;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.3px;
            margin-top: 0.2mm;
        }
        .card-fleje2 .body-grid {
            flex: 1;
            display: flex;
            height: 20.5mm;
            border-bottom: 1px solid #cbd5e1;
        }
        .card-fleje2 .specs-column {
            width: 44%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 0.5px solid #cbd5e1;
            background: #f8fafc;
            padding: 1.5mm 2mm;
            overflow: hidden;
        }
        .card-fleje2 .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6mm;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .card-fleje2 .spec-item {
            font-size: 4.8pt;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.1;
            display: flex;
            align-items: flex-start;
        }
        .card-fleje2 .spec-bullet {
            color: #e30613;
            font-weight: bold;
            margin-right: 0.8mm;
            font-size: 5pt;
            line-height: 1;
        }
        .card-fleje2 .spec-text {
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-fleje2 .image-column {
            width: 56%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8mm;
            background: #ffffff;
        }
        .card-fleje2 .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-fleje2 .footer-grid {
            height: 6mm;
            display: flex;
            background: #f1f5f9;
        }
        .card-fleje2 .footer-cell {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 1px solid #cbd5e1;
            padding: 0.2mm 1.5mm;
        }
        .card-fleje2 .footer-cell:last-child {
            border-right: none;
        }
        .card-fleje2 .footer-label {
            font-size: 5pt;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
        }
        .card-fleje2 .footer-value {
            font-size: 7.5pt;
            font-weight: 700;
            color: #0f172a;
        }
        .card-fleje2 .bottom-bar {
            height: 2mm;
            background: #e30613; /* Rojo Easy */
            width: 100%;
        }

        /* DISEÑO DE FICHA A4 (Multipágina Concatenada Oficial) */
        .page-a4 {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            padding: 0;
            overflow: hidden;
            width: 210mm;
            height: 297mm;
            page-break-after: always;
            box-sizing: border-box;
        }
        .page-a4 .header {
            background: #222222;
            color: #ffffff;
            height: 52mm;
            padding: 8mm 15mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-a4 .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 72%;
        }
        .page-a4 .header-title {
            font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif;
            font-size: 30pt;
            font-weight: 900;
            text-transform: uppercase;

            line-height: 1.08;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 25mm;
        }
        .page-a4 .header-title.title-size-short {
            font-size: 34pt;
            line-height: 1.05;
        }
        .page-a4 .header-title.title-size-medium {
            font-size: 28pt;
            line-height: 1.08;
        }
        .page-a4 .header-title.title-size-long {
            font-size: 22pt;
            line-height: 1.12;
        }
        .page-a4 .header-subtitle {
            font-size: 22pt;
            font-weight: 800;
            color: #ffed00; /* Amarillo Easy */
            margin-top: 1.5mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .page-a4 .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 26%;
            align-items: flex-end;
        }
        .page-a4 .header-brand {
            font-size: 26pt;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.1;
        }
        .page-a4 .header-sku {
            font-size: 18pt;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            margin-top: 2mm;
        }

        /* Body Grid */
        .page-a4 .body-grid {
            flex: 1;
            display: flex;
            height: 193mm;
            border-bottom: 2px solid #cbd5e1;
        }
        
        /* Columna Izquierda (Specs) */
        .page-a4 .specs-column {
            width: 44%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px solid #cbd5e1;
            background: #f8fafc;
            padding: 6mm 9mm;
            overflow: hidden;
        }
        .page-a4 .specs-list {

            display: flex;

        .page-a4 .specs-list.density-low {

        .page-a4 .specs-list.density-low .spec-item {

        }
        .page-a4 .specs-list.density-normal {
            gap: 3.8mm;
        }
        .page-a4 .specs-list.density-normal .spec-item {

        .page-a4 .specs-list.density-high {

        .page-a4 .specs-list.density-high .spec-item {

        /* ESTILOS ROBUST FLEJE 3 (100x70mm) */
        .card-robust-fleje3 {
            width: 100mm;
            height: 70mm;
            background: #5d6368;
            border: 1.5px dashed #ffffff;
            isolation: isolate;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            padding: 3.2mm 3.8mm 2.8mm 3.8mm;
            box-sizing: border-box;
        }
        .card-robust-fleje3 .brand-container {
            margin-bottom: 1.2mm;
            max-height: 7.5mm;
            display: flex;
            align-items: center;
        }
        .card-robust-fleje3 .brand-container img {
            max-height: 7.5mm;
            max-width: 38mm;
            object-fit: contain;
            display: block;
            mix-blend-mode: screen;
        }
        .card-robust-fleje3 .left-content {
            width: 48mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            height: 100%;

        .card-robust-fleje3 .title-container {

            word-break: break-word;
        }
        .card-robust-fleje3 .title-primary.title-size-short {
            font-size: 9.5pt;
            line-height: 1.02;
        }
        .card-robust-fleje3 .title-primary.title-size-medium {
            font-size: 8.5pt;
            line-height: 1.05;
        }
        .card-robust-fleje3 .title-primary.title-size-long {

            line-height: 1.05;

        .card-robust-fleje3 .title-secondary {

            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.08;

        .card-robust-fleje3 .spec-item {
