<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartela Robust Fleje 2 (80x40mm)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #f8fafc;
            overflow: hidden;
            display: block;
            padding: 15mm;
        }
        
        @media print {
            body { background: #fff; }
            @page { size: A4 portrait; margin: 0; }
        }

        .card {
            width: 80mm;
            height: 40mm;
            background: #464d53; /* Fondo gris oscuro Robust */
            border: 1px dashed #6c757d;
            display: flex;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            padding: 2.5mm 3mm;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.15);
        }
        @media print { .card { box-shadow: none; } }

        .left-content {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }

        .brand-logo-text {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 10pt;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            line-height: 1;
        }

        .product-title {
            font-size: 7.5pt;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.05;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0.8mm 0;
        }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4mm;
        }
        .spec-item {
            font-size: 5.5pt;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sku-box {
            border-top: 0.8px solid rgba(255, 255, 255, 0.6);
            border-bottom: 0.8px solid rgba(255, 255, 255, 0.6);
            padding: 0.3mm 0;
            margin-top: auto;
            width: fit-content;
        }
        .sku-text {
            font-size: 5.5pt;
            font-weight: 700;
            color: #ffffff;
        }

        .right-content {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .image-container {
            width: 100%;
            height: 23mm;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .warranty-seal {
            width: 9.5mm;
            height: 9.5mm;
            border: 1px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(70, 77, 83, 0.9);
        }
        .warranty-label {
            font-size: 2.2pt;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1;
        }
        .warranty-number {
            font-size: 6.5pt;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.9;
            font-family: 'Arial Black', sans-serif;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left-content">
            <div>
                <div class="brand-logo-text">ROBUST</div>
                <div class="product-title">{{descripcion}}</div>
                <ul class="specs-list">
                    <li class="spec-item">· {{spec1_label}}: {{spec1_value}}</li>
                    <li class="spec-item">· {{spec2_label}}: {{spec2_value}}</li>
                    <li class="spec-item">· {{spec3_label}}: {{spec3_value}}</li>
                </ul>
            </div>
            <div class="sku-box">
                <span class="sku-text">SKU: {{sku}}</span>
            </div>
        </div>

        <div class="right-content">
            <div class="image-container">
                <img class="product-image" src="{{foto_url}}" alt="Foto" />
            </div>
            <div class="warranty-seal">
                <span class="warranty-label">GARANTÍA</span>
                <span class="warranty-number">{{garantia_numero}}</span>
                <span class="warranty-label">AÑOS</span>
            </div>
        </div>
    </div>
</body>
</html>
