<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartela Robust Fleje 2 (80x40mm)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #f8fafc;
            overflow: hidden;
            display: block;
            padding: 15mm;
        }
        
        @media print {
            body { background: #fff; }
            @page { size: A4 portrait; margin: 0; }
        }

        .card {
            width: 80mm;
            height: 40mm;
            background: #5d6368;
            border: 1.2px dashed #ffffff; /* LÍNEAS PUNTEADAS EN LOS 4 COSTADOS */
            isolation: isolate;
            display: flex;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            padding: 2.5mm 3.5mm;
        }

        .left-content {
            width: 46%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            height: 100%;
            overflow: hidden;
        }

        .brand-container {
            margin-bottom: 1.8mm;
            max-height: 5mm;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .brand-container img {
            max-height: 5mm;
            max-width: 24mm;
            object-fit: contain;
            display: block;
            mix-blend-mode: screen;
        }
        .brand-container div, .brand-container span {
            font-family: 'Orbitron', 'Montserrat', 'Arial Black', sans-serif;
            font-size: 9.5pt;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .title-container {
            margin-top: 1mm;
            margin-bottom: 1mm;
            max-width: 100%;
            overflow: hidden;
        }

        .title-primary {
            font-size: 6.5pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 0.95;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .title-secondary {
            font-size: 5.5pt;
            font-weight: 500;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 0.8mm;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .highlight-pill {
            display: {{pill_display}};
            align-items: center;
            border: 0.8px solid rgba(255, 255, 255, 0.9);
            border-radius: 3px;
            padding: 0.3mm 1.2mm;
            font-size: 4.8pt;
            font-weight: 700;
            margin-bottom: 0.8mm;
            width: fit-content;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }
        .pill-text-white { color: #ffffff; }
        .pill-bolt { color: #ffffff; margin: 0 0.4mm; font-size: 4.2pt; }
        .pill-text-cyan { color: #00c3e6; font-weight: 800; }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.3mm;
            max-width: 100%;
        }
        .spec-item {
            font-size: 4.8pt;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.1;
            display: flex;
            align-items: flex-start;
        }
        .spec-bullet {
            color: #ffffff;
            margin-right: 0.8mm;
            font-size: 5.5pt;
            line-height: 1;
        }
        .spec-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sku-box {
            border-top: 0.8px solid #ffffff;
            border-bottom: 0.8px solid #ffffff;
            padding: 0.8mm 0;
            margin-top: auto;
            width: 20mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .sku-text {
            font-size: 4.8pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 0.4px;
        }
        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 0.4mm;
            margin-top: 0.8mm;
        }
        .meta-text {
            font-size: 4.2pt;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.1px;
        }

        .right-content {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 2mm;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent;
        }

        .warranty-seal {
            position: absolute;
            right: 2.5mm;
            bottom: 2.5mm;
            width: 11mm;
            height: 11mm;
            object-fit: contain;
            display: {{warranty_seal_display}};
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left-content">
            <div>
                <div class="brand-container">
                    {{marca}}
                </div>

                <div class="title-container">
                    <div class="title-primary">{{titulo_linea1}}</div>
                    <div class="title-secondary">{{titulo_linea2}}</div>
                </div>

                <div class="highlight-pill">
                    <span class="pill-text-white">{{destacado_val}}</span>
                    <span class="pill-bolt">⚡</span>
                    <span class="pill-text-cyan">{{destacado_lbl}}</span>
                </div>

                <ul class="specs-list">
                    {{specs_html}}
                </ul>
            </div>

            <div class="sku-box">
                <span class="sku-text">SKU: {{sku}}</span>
            </div>

            <!-- Origen y Garantía Dinámicos para Robust -->
            {{meta_info_html}}
        </div>

        <div class="right-content">
            <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
            <img class="warranty-seal" src="{{garantia_sello_img}}" alt="5 Años de Garantía" />
        </div>
    </div>
</body>
</html>
