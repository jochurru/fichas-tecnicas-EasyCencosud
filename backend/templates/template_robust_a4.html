<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha Técnica Robust A4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #5d6368;
            overflow: hidden;
            display: block;
            padding: 8mm;
            color: #ffffff;
        }
        
        @media print {
            body {
                background: #5d6368;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2px dashed rgba(255, 255, 255, 0.85); /* LÍNEAS PUNTEADAS MÁS ABIERTAS */
            isolation: isolate;
            padding: 10mm 12mm;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6mm;
        }
        .brand-container {
            margin-bottom: 6mm;
            max-height: 26mm;
            display: flex;
            align-items: center;
        }
        .brand-container img, .brand-container svg {
            max-height: 26mm;
            max-width: 110mm;
            object-fit: contain;
            display: block;
            mix-blend-mode: screen;
        }
        .brand-container div, .brand-container span {
            font-family: 'Orbitron', 'Montserrat', 'Arial Black', sans-serif;
            font-size: 32pt;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .title-primary {
            font-size: 34pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: 0.5px;
            margin-bottom: 2mm;
            word-break: break-word;
        }
        .title-primary.title-size-short {
            font-size: 36pt;
            line-height: 1;
        }
        .title-primary.title-size-medium {
            font-size: 30pt;
            line-height: 1.05;
        }
        .title-primary.title-size-long {
            font-size: 24pt;
            line-height: 1.08;
        }
        .title-secondary {
            font-size: 22pt;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 4mm;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .title-secondary.title-size-long {
            font-size: 18pt;
            line-height: 1.1;
        }

        .body-grid {
            display: flex;
            flex: 1;
            margin: 4mm 0;
            position: relative;
            align-items: stretch;
            justify-content: space-between;
        }

        .specs-column {
            width: 48%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 10;
            overflow: visible;
        }

        .highlight-pill {
            display: var(--pill-display, flex);
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            padding: 2mm 5mm;
            font-size: 14pt;
            font-weight: 700;
            width: fit-content;
            margin-bottom: 4mm;
            max-width: 100%;
            box-sizing: border-box;
        }
        .pill-text-white { color: #ffffff; }
        .pill-bolt { color: #ffffff; margin: 0 2mm; font-size: 13pt; }
        .pill-text-cyan { color: #00c3e6; font-weight: 800; }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3.5mm;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }
        .specs-list.density-low {
            gap: 5mm;
        }
        .specs-list.density-low .spec-item {
            font-size: 15pt;
        }
        .specs-list.density-normal {
            gap: 3.5mm;
        }
        .specs-list.density-normal .spec-item {
            font-size: 13.5pt;
        }
        .specs-list.density-high {
            gap: 2.5mm;
        }
        .specs-list.density-high .spec-item {
            font-size: 12pt;
        }
        .spec-item {
            font-size: 13.5pt;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            line-height: 1.25;
        }
        .spec-bullet {
            color: #ffffff;
            font-size: 15pt;
            margin-right: 3mm;
            line-height: 1;
        }
        .spec-text {
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .right-column {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 4mm;
            z-index: 5;
        }

        .product-image {
            max-width: 100%;
            max-height: 175mm;
            object-fit: contain;
            background: transparent;
        }

        .sku-box {
            border-top: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 2.5mm 0;
            margin-top: auto;
            width: 70mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .sku-text {
            font-size: 18pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 1px;
        }
        .meta-info {
            display: flex;
            gap: 5mm;
            margin-top: 2.5mm;
        }
        .meta-text {
            font-size: 11pt;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .warranty-seal {
            display: var(--warranty-display, flex);
            position: absolute;
            right: 0;
            bottom: 0;
            width: 40mm;
            height: 40mm;
            object-fit: contain;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="header">
                <div>
                    <div class="brand-container">
                        {{marca}}
                    </div>

                    <div class="title-primary {{title_class}}">{{titulo_linea1}}</div>
                    <div class="title-secondary {{title_class}}">{{titulo_linea2}}</div>
                </div>
            </div>

            <div class="body-grid">
                <div class="specs-column">
                    <div class="highlight-pill" style="--pill-display: {{pill_display}};">
                        <span class="pill-text-white">{{destacado_val}}</span>
                        <span class="pill-bolt">⚡</span>
                        <span class="pill-text-cyan">{{destacado_lbl}}</span>
                    </div>

                    <ul class="specs-list {{density_class}}">
                        {{specs_html}}
                    </ul>
                </div>

                <div class="right-column">
                    <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
                    <img class="warranty-seal" style="--warranty-display: {{warranty_seal_display}};" src="{{garantia_sello_img}}" alt="5 Años de Garantía" />
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; position: relative;">
            <div>
                <div class="sku-box">
                    <span class="sku-text">SKU: {{sku}}</span>
                </div>
                {{meta_info_html}}
            </div>
        </div>
    </div>
</body>
</html>
