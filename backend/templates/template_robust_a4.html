<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha Técnica Robust A4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #5d6368;
            overflow: hidden;
            display: block;
            padding: 15mm;
            color: #ffffff;
        }
        
        @media print {
            body {
                background: #5d6368;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2px dashed #ffffff; /* LÍNEAS PUNTEADAS EN LOS 4 COSTADOS */
            isolation: isolate;
            padding: 10mm 8mm;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8mm;
        }
        .brand-container {
            margin-bottom: 6mm;
            max-height: 18mm;
        }
        .brand-container img {
            max-height: 18mm;
            max-width: 75mm;
            object-fit: contain;
            display: block;
        }
        .brand-container span {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 28pt;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .title-primary {
            font-size: 26pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.5px;
        }
        .title-secondary {
            font-size: 22pt;
            font-weight: 500;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1;
            margin-top: 1mm;
        }

        .body-grid {
            display: flex;
            flex: 1;
            margin: 6mm 0;
            position: relative;
        }

        .specs-column {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 6mm;
            z-index: 10;
            overflow: hidden;
        }

        .highlight-pill {
            display: inline-flex;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            padding: 2mm 6mm;
            font-size: 14pt;
            font-weight: 700;
            width: fit-content;
            margin-bottom: 4mm;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }
        .pill-text-white { color: #ffffff; }
        .pill-bolt { color: #ffffff; margin: 0 2mm; font-size: 13pt; }
        .pill-text-cyan { color: #00c3e6; font-weight: 800; }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4.5mm;
            max-width: 100%;
        }
        .spec-item {
            font-size: 13pt;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            line-height: 1.25;
        }
        .spec-bullet {
            color: #ffffff;
            font-size: 15pt;
            margin-right: 3mm;
            line-height: 1;
        }

        .right-column {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 5mm;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sku-box {
            border-top: 1.5px solid #ffffff;
            border-bottom: 1.5px solid #ffffff;
            padding: 1.5mm 0;
            margin-top: auto;
            width: 50mm;
        }
        .sku-text {
            font-size: 14pt;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .warranty-seal {
            position: absolute;
            right: 5mm;
            bottom: 5mm;
            width: 38mm;
            height: 38mm;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: transparent;
            z-index: 20;
        }
        .warranty-seal-inner {
            width: 34mm;
            height: 34mm;
            border: 1.5px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .warranty-label {
            font-size: 7.5pt;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
        }
        .warranty-number {
            font-size: 26pt;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.95;
            font-family: 'Arial Black', sans-serif;
            margin: 0.5mm 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="header">
                <div>
                    <div class="brand-container">
                        {{marca}}
                    </div>

                    <div class="title-primary">{{titulo_linea1}}</div>
                    <div class="title-secondary">{{titulo_linea2}}</div>
                </div>
            </div>

            <div class="body-grid">
                <div class="specs-column">
                    <div class="highlight-pill">
                        <span class="pill-text-white">{{destacado_val}}</span>
                        <span class="pill-bolt">⚡</span>
                        <span class="pill-text-cyan">{{destacado_lbl}}</span>
                    </div>

                    <ul class="specs-list">
                        {{specs_html}}
                    </ul>
                </div>

                <div class="right-column">
                    <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; position: relative;">
            <div class="sku-box">
                <span class="sku-text">SKU: {{sku}}</span>
            </div>

            <div class="warranty-seal">
                <div class="warranty-seal-inner">
                    <span class="warranty-label">AÑOS DE GARANTÍA</span>
                    <span class="warranty-number">{{garantia_numero}}</span>
                    <span class="warranty-label">AÑOS DE GARANTÍA</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
