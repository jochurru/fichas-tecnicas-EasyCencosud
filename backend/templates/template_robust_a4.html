<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha Técnica Robust A4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@600;700;800;900&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        body {
            width: 210mm;
            height: 297mm;
            background: #5d6368;
            overflow: hidden;
            display: block;
            padding: 15mm;
            color: #ffffff;
        }
        
        @media print {
            body {
                background: #5d6368;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2.5px dashed #ffffff; /* LÍNEAS PUNTEADAS EN LOS 4 COSTADOS */
            isolation: isolate;
            padding: 12mm 12mm;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10mm;
        }
        .brand-container {
            margin-bottom: 8mm;
            max-height: 28mm;
            display: flex;
            align-items: center;
        }
        .brand-container img, .brand-container svg {
            max-height: 28mm;
            max-width: 110mm;
            object-fit: contain;
            display: block;
            mix-blend-mode: screen;
        }
        .brand-container div, .brand-container span {
            font-family: 'Orbitron', 'Montserrat', 'Arial Black', sans-serif;
            font-size: 34pt;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .title-primary {
            font-size: 36pt;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: 0.5px;
            margin-bottom: 2mm;
        }
        .title-secondary {
            font-size: 26pt;
            font-weight: 500;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 8mm;
        }

        .body-grid {
            display: flex;
            flex: 1;
            margin: 8mm 0;
            position: relative;
            align-items: center;
        }

        .specs-column {
            width: 44%;
            display: flex;
            flex-direction: column;
            gap: 8mm;
            z-index: 10;
            overflow: hidden;
        }

        .highlight-pill {
            display: {{pill_display}};
            align-items: center;
            border: 2.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 3mm 8mm;
            font-size: 18pt;
            font-weight: 700;
            width: fit-content;
            margin-bottom: 6mm;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }
        .pill-text-white { color: #ffffff; }
        .pill-bolt { color: #ffffff; margin: 0 3mm; font-size: 17pt; }
        .pill-text-cyan { color: #00c3e6; font-weight: 800; }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6mm;
            max-width: 100%;
        }
        .spec-item {
            font-size: 18pt;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            line-height: 1.35;
        }
        .spec-bullet {
            color: #ffffff;
            font-size: 22pt;
            margin-right: 4mm;
            line-height: 1;
        }

        .right-column {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 56%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 2mm;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent;
            transform: scale(1.25);
            transform-origin: center;
        }

        .sku-box {
            border-top: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 2.5mm 0;
            margin-top: auto;
            width: 70mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .sku-text {
            font-size: 18pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 1px;
        }
        .meta-info {
            display: flex;
            gap: 5mm;
            margin-top: 2.5mm;
        }
        .meta-text {
            font-size: 11pt;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .warranty-seal {
            position: absolute;
            right: 8mm;
            bottom: 8mm;
            width: 44mm;
            height: 44mm;
            object-fit: contain;
            display: {{warranty_seal_display}};
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="header">
                <div>
                    <div class="brand-container">
                        {{marca}}
                    </div>

                    <div class="title-primary">{{titulo_linea1}}</div>
                    <div class="title-secondary">{{titulo_linea2}}</div>
                </div>
            </div>

            <div class="body-grid">
                <div class="specs-column">
                    <div class="highlight-pill">
                        <span class="pill-text-white">{{destacado_val}}</span>
                        <span class="pill-bolt">⚡</span>
                        <span class="pill-text-cyan">{{destacado_lbl}}</span>
                    </div>

                    <ul class="specs-list">
                        {{specs_html}}
                    </ul>
                </div>

                <div class="right-column">
                    <img class="product-image" src="{{foto_url}}" alt="Foto Producto" />
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; position: relative;">
            <div>
                <div class="sku-box">
                    <span class="sku-text">SKU: {{sku}}</span>
                </div>
                {{meta_info_html}}
            </div>

            <img class="warranty-seal" src="{{garantia_sello_img}}" alt="5 Años de Garantía" />
        </div>
    </div>
</body>
</html>
